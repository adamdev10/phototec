spring.application.name=phototec
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_TEST_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

storage.s3.endpoint=http://localhost:8333
storage.s3.access-key=${STORAGE_ACCESS_KEY}
storage.s3.secret-key=${STORAGE_SECRET_KEY}
storage.s3.bucket=photos.test
storage.s3.region=eu-south-2

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database=postgresql
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG