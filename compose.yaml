services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: phototec
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      retries: 20

  create-buckets:
    image: amazon/aws-cli:2.37.9
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: eu-south-2
      AWS_ENDPOINT_URL: http://seaweedfs:8333
    entrypoint: ["/bin/sh", "-c"]
    command: ["aws s3 mb s3://photos; aws s3 mb s3://photos.test; exit 0"]

volumes:
  postgres-data:
  seaweedfs-data:
